name: Video helper (Windows)

# The desktop helper (#99) is a Tauri app, so it is built on the platform it runs on. This is
# not part of the per-push CI: it runs on demand (the "Run workflow" button / `gh workflow
# run`) and on a `video-v*` tag, which also publishes a GitHub release with the installer.
# Modelled on GridFPV's own release-builds workflow; Windows only for now.
on:
  workflow_dispatch:
  push:
    tags: ['video-v*']
    # While the helper is built on its branch (GitHub only dispatches a workflow that exists
    # on the default branch): a push that touches the helper builds it.
    branches: ['video-helper-2']
    paths:
      - 'helper/**'
      - 'companion/**'
      - 'frontend/apps/video-ui/**'
      - 'frontend/packages/components/**'
      - 'dev/stage_helper.py'
      - 'dev/package_companion.py'
      - '.github/workflows/helper-windows.yml'

concurrency:
  group: helper-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: windows — NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helper/src-tauri
          key: windows

      # The window: the component library + the video-ui app → companion/ui.
      - name: Build the window
        run: |
          npm ci
          npm run build:video
        working-directory: frontend

      - name: Companion tests
        run: |
          npm ci
          npm test
        working-directory: companion

      # The pipeline as it ships (src + prod node_modules + ui) and the pinned node.exe, named
      # as Tauri's external binary for this target.
      - name: Stage the companion and node.exe
        run: python dev/stage_helper.py --triple x86_64-pc-windows-msvc

      - name: Build the installer
        run: npx -y @tauri-apps/cli@2 build --bundles nsis
        working-directory: helper/src-tauri

      - name: List what was built
        shell: bash
        run: ls -la helper/src-tauri/target/release/bundle/nsis/

      - uses: actions/upload-artifact@v4
        with:
          name: gridfpv-video-windows-installer
          path: helper/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish the release (tags only)
        if: startsWith(github.ref, 'refs/tags/video-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" helper/src-tauri/target/release/bundle/nsis/*.exe \
            --title "GridFPV Video $tag" \
            --notes "The Windows installer for the GridFPV Video helper (#99). Per-user install, no admin. Needs OBS 28+ with its WebSocket server on; for a per-race recording independent of the stream, the Source Record plugin (#98)." \
            || gh release upload "$tag" helper/src-tauri/target/release/bundle/nsis/*.exe --clobber
