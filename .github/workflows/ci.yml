name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make setup
      - run: make build
      - run: make lint
      - run: make check
      - run: make test
      - run: make zip
      # Browser e2e against the rig (T1, #29): RotorHazard 4.4.0 with mock nodes in Docker.
      - run: make rig-up
      - run: make e2e-install
      - run: make e2e
      - if: failure()
        run: docker compose -f dev/docker-compose.yml logs --no-color rotorhazard | tail -200
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/e2e/playwright-report
            frontend/e2e/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: gridfpv-plugin
          path: dist/*.zip
