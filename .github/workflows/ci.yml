name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make setup
      - run: make build
      - run: make lint
      - run: make check
      - run: make test
      - run: make zip
      - uses: actions/upload-artifact@v4
        with:
          name: gridfpv-plugin
          path: dist/*.zip
